<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" aria-label="Sơ đồ mười phút trước và mười phút sau buổi chạy: đi bộ nhanh 5 phút, động tác nhẹ 3 phút, chạy chậm 2 phút; sau chạy đi bộ chậm 5 phút, giãn mỗi động tác 10 đến 15 giây, ghi chép">
  <rect width="680" height="340" fill="#ffffff"/>
  <text x="340" y="28" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a3a4a">Mười phút trước và mười phút sau buổi chạy</text>
  <text x="340" y="48" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Gợi ý sắp xếp theo bài “Khởi động và thả lỏng”. Khởi động 5–10 phút, thả lỏng 5–10 phút (NHS Inform).</text>
  <g font-family="sans-serif" font-size="13" fill="#1a3a4a">
    <text x="20" y="100" font-weight="bold">Trước chạy</text>
    <rect x="120" y="78" width="170" height="44" fill="#2e7d6b"/><text x="205" y="96" text-anchor="middle" fill="#ffffff">Đi bộ nhanh</text><text x="205" y="113" text-anchor="middle" fill="#ffffff" font-size="11">5 phút (phút 1–5)</text>
    <rect x="300" y="78" width="170" height="44" fill="#bcd8d2"/><text x="385" y="96" text-anchor="middle">Động tác nhẹ</text><text x="385" y="113" text-anchor="middle" font-size="11">3 phút (phút 6–8)</text>
    <rect x="480" y="78" width="170" height="44" fill="#2e7d6b"/><text x="565" y="96" text-anchor="middle" fill="#ffffff">Chạy chậm</text><text x="565" y="113" text-anchor="middle" fill="#ffffff" font-size="11">2 phút (phút 9–10)</text>
    <text x="340" y="142" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Xoay cổ chân, xoay vai, vung tay, bước sang hai bên, nâng gối thấp</text>
    <text x="20" y="196" font-weight="bold">Sau chạy</text>
    <rect x="120" y="174" width="170" height="44" fill="#2e7d6b"/><text x="205" y="192" text-anchor="middle" fill="#ffffff">Đi bộ chậm dần</text><text x="205" y="209" text-anchor="middle" fill="#ffffff" font-size="11">5 phút (phút 1–5)</text>
    <rect x="300" y="174" width="170" height="44" fill="#bcd8d2"/><text x="385" y="192" text-anchor="middle">Giãn nhẹ</text><text x="385" y="209" text-anchor="middle" font-size="11">mỗi động tác 10–15 giây</text>
    <rect x="480" y="174" width="170" height="44" fill="#2e7d6b"/><text x="565" y="192" text-anchor="middle" fill="#ffffff">Ghi chép</text><text x="565" y="209" text-anchor="middle" fill="#ffffff" font-size="11">phút 10</text>
    <text x="340" y="238" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Giãn bắp chân, đùi trước, đùi sau — chỉ kéo giãn nhẹ, không cố chịu đau</text>
  </g>
  <text x="340" y="278" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Dừng ngay nếu thấy đau.</text>
  <text x="340" y="300" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">Hình minh họa được vẽ riêng cho website.</text>
</svg>
