<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-label="Sơ đồ kiểm tra giày vừa chân: chừa nửa inch trước mũi giày, gót cứng giữ chân, đế trước gập ở khớp ngón chân">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="28" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a3a4a">Bốn điểm kiểm tra giày vừa chân</text>
  <text x="340" y="48" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Hình minh họa được vẽ riêng cho website theo UCSF Health và Penn State Health.</text>
  <g>
    <path d="M120 210 L120 150 Q120 128 150 128 L300 128 Q380 128 440 150 L520 178 Q540 186 535 198 L530 210 L120 210 Z" fill="#e8f0ee" stroke="#1a3a4a" stroke-width="2"/>
    <path d="M120 210 L530 210 L530 222 L120 222 Z" fill="#2e7d6b"/>
    <line x1="430" y1="128" x2="430" y2="210" stroke="#c25e3a" stroke-width="2" stroke-dasharray="5,4"/>
    <line x1="470" y1="110" x2="520" y2="110" stroke="#c25e3a" stroke-width="2"/>
    <line x1="470" y1="104" x2="470" y2="116" stroke="#c25e3a" stroke-width="2"/>
    <line x1="520" y1="104" x2="520" y2="116" stroke="#c25e3a" stroke-width="2"/>
    <text x="495" y="96" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c25e3a">1/2 inch (~1,3 cm)</text>
    <text x="495" y="80" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1a3a4a">Chừa trước mũi giày</text>
    <line x1="150" y1="128" x2="150" y2="210" stroke="#c25e3a" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="150" y="250" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1a3a4a">Gót cứng giữ chân, không trượt</text>
    <line x1="300" y1="128" x2="300" y2="210" stroke="#c25e3a" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="300" y="250" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1a3a4a">Đế trước gập ở khớp ngón chân</text>
    <text x="340" y="285" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Thử giày vào cuối ngày, mang đúng đôi tất sẽ chạy cùng, thử cả hai chân.</text>
    <text x="340" y="305" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Quy tắc chung: thay giày sau 450–600 dặm (khoảng 724–966 km).</text>
  </g>
</svg>
