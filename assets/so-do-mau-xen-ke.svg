<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-label="Bốn mẫu chạy đi bộ xen kẽ A đến D, mỗi mẫu là một chu kỳ chạy rồi đi bộ lặp lại">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="28" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a3a4a">Bốn mẫu chạy – đi bộ xen kẽ (gợi ý sắp xếp)</text>
  <text x="340" y="48" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Lặp lại chu kỳ cho đủ buổi.</text>
  <g font-family="sans-serif" font-size="13" fill="#1a3a4a">
    <text x="20" y="100" font-weight="bold">Mẫu A</text>
    <rect x="90" y="80" width="26" height="34" fill="#2e7d6b"/><text x="103" y="101" text-anchor="middle" fill="#ffffff" font-size="11">1'</text>
    <rect x="116" y="80" width="52" height="34" fill="#bcd8d2"/><text x="142" y="101" text-anchor="middle" font-size="11">2'</text>
    <rect x="168" y="80" width="26" height="34" fill="#2e7d6b"/><text x="181" y="101" text-anchor="middle" fill="#ffffff" font-size="11">1'</text>
    <rect x="194" y="80" width="52" height="34" fill="#bcd8d2"/><text x="220" y="101" text-anchor="middle" font-size="11">2'</text>
    <text x="261" y="101" font-size="16">…</text>
    <text x="296" y="101" font-size="12" fill="#555555">Chạy 1' – đi bộ 2', lặp lại</text>
    <text x="20" y="160" font-weight="bold">Mẫu B</text>
    <rect x="90" y="140" width="26" height="34" fill="#2e7d6b"/><text x="103" y="161" text-anchor="middle" fill="#ffffff" font-size="11">1'</text>
    <rect x="116" y="140" width="39" height="34" fill="#bcd8d2"/><text x="135" y="161" text-anchor="middle" font-size="11">1'30"</text>
    <rect x="155" y="140" width="26" height="34" fill="#2e7d6b"/><text x="168" y="161" text-anchor="middle" fill="#ffffff" font-size="11">1'</text>
    <rect x="181" y="140" width="39" height="34" fill="#bcd8d2"/><text x="200" y="161" text-anchor="middle" font-size="11">1'30"</text>
    <text x="235" y="161" font-size="16">…</text>
    <text x="270" y="161" font-size="12" fill="#555555">Chạy 1' – đi bộ 1'30", lặp lại</text>
    <text x="20" y="220" font-weight="bold">Mẫu C</text>
    <rect x="90" y="200" width="26" height="34" fill="#2e7d6b"/><text x="103" y="221" text-anchor="middle" fill="#ffffff" font-size="11">1'</text>
    <rect x="116" y="200" width="26" height="34" fill="#bcd8d2"/><text x="129" y="221" text-anchor="middle" font-size="11">1'</text>
    <rect x="142" y="200" width="26" height="34" fill="#2e7d6b"/><text x="155" y="221" text-anchor="middle" fill="#ffffff" font-size="11">1'</text>
    <rect x="168" y="200" width="26" height="34" fill="#bcd8d2"/><text x="181" y="221" text-anchor="middle" font-size="11">1'</text>
    <text x="209" y="221" font-size="16">…</text>
    <text x="244" y="221" font-size="12" fill="#555555">Chạy 1' – đi bộ 1', lặp lại</text>
    <text x="20" y="280" font-weight="bold">Mẫu D</text>
    <rect x="90" y="260" width="52" height="34" fill="#2e7d6b"/><text x="116" y="281" text-anchor="middle" fill="#ffffff" font-size="11">2'</text>
    <rect x="142" y="260" width="26" height="34" fill="#bcd8d2"/><text x="155" y="281" text-anchor="middle" font-size="11">1'</text>
    <rect x="168" y="260" width="52" height="34" fill="#2e7d6b"/><text x="194" y="281" text-anchor="middle" font-size="11">2'</text>
    <rect x="220" y="260" width="26" height="34" fill="#bcd8d2"/><text x="233" y="281" text-anchor="middle" font-size="11">1'</text>
    <text x="261" y="281" font-size="16">…</text>
    <text x="296" y="281" font-size="12" fill="#555555">Chạy 2' – đi bộ 1', lặp lại</text>
  </g>
  <text x="340" y="310" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">Khối xanh đậm: chạy. Khối xanh nhạt: đi bộ.</text>
</svg>
