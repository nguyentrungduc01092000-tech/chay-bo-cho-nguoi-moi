<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="Năm bước làm sạch thân giày theo REI: tháo dây giày, tháo lót giày, chải nhẹ lấy bụi và đất khô, chà bằng dung dịch xà phòng nhẹ, xả sạch bằng nước sạch; không cho giày vào máy giặt; lót giày làm sạch bằng dung dịch một phần giấm pha với hai phần nước">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="340" y="28" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a3a4a">Năm bước làm sạch thân giày (REI)</text>
  <text x="340" y="48" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Theo quy trình trong Bài 10. Không cho giày vào máy giặt.</text>
  <g font-family="sans-serif" font-size="13" fill="#1a3a4a">
    <circle cx="50" cy="92" r="16" fill="#2e7d6b"/><text x="50" y="97" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
    <text x="80" y="97">Tháo dây giày ra</text>
    <circle cx="50" cy="132" r="16" fill="#2e7d6b"/><text x="50" y="137" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
    <text x="80" y="137">Tháo lót giày ra</text>
    <circle cx="50" cy="172" r="16" fill="#2e7d6b"/><text x="50" y="177" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
    <text x="80" y="177">Chải nhẹ lấy bụi và đất khô</text>
    <circle cx="50" cy="212" r="16" fill="#2e7d6b"/><text x="50" y="217" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
    <text x="80" y="217">Chà bằng dung dịch xà phòng nhẹ</text>
    <circle cx="50" cy="252" r="16" fill="#2e7d6b"/><text x="50" y="257" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
    <text x="80" y="257">Xả sạch bằng nước sạch</text>
  </g>
  <text x="340" y="300" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1a3a4a">Lót giày: dung dịch 1 phần giấm pha với 2 phần nước.</text>
  <text x="340" y="340" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">Hình minh họa tự vẽ.</text>
</svg>
