<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-label="Sơ đồ ngày chạy đầu tiên: hôm trước ngủ đủ giấc, chuẩn bị giày quần áo, chọn đường chạy quen và báo người nhà; trong buổi đi bộ nhanh 5 phút, chạy 2 phút xen kẽ đi bộ 2 phút lặp 5 lần, đi bộ chậm 5 phút; sau buổi ghi lại cảm giác, uống nước ăn nhẹ, ngủ đủ và nghỉ một ngày rồi chạy tiếp">
  <rect width="680" height="320" fill="#ffffff"/>
  <text x="340" y="28" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a3a4a">Ngày chạy đầu tiên: trước, trong và sau buổi chạy</text>
  <text x="340" y="48" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Tóm tắt từ bài “Cách đặt mục tiêu 5km đầu tiên mà không vội vàng”. Gợi ý sắp xếp.</text>
  <g font-family="sans-serif" font-size="13" fill="#1a3a4a">
    <text x="130" y="70" text-anchor="middle" font-weight="bold">Hôm trước</text>
    <rect x="40" y="82" width="180" height="110" fill="#bcd8d2"/><text x="130" y="108" text-anchor="middle" font-size="12">Ngủ đủ giấc</text><text x="130" y="130" text-anchor="middle" font-size="12">Giày, quần áo sẵn</text><text x="130" y="152" text-anchor="middle" font-size="12">Đường quen, báo nhà</text>
    <text x="240" y="140" font-size="20" fill="#555555">→</text>
    <text x="350" y="70" text-anchor="middle" font-weight="bold">Trong buổi</text>
    <rect x="260" y="82" width="180" height="110" fill="#2e7d6b"/><text x="350" y="108" text-anchor="middle" fill="#ffffff" font-size="12">Đi bộ nhanh 5 phút</text><text x="350" y="130" text-anchor="middle" fill="#ffffff" font-size="12">Chạy 2 phút, đi bộ</text><text x="350" y="152" text-anchor="middle" fill="#ffffff" font-size="12">2 phút, lặp 5 lần</text><text x="350" y="174" text-anchor="middle" fill="#ffffff" font-size="12">Đi bộ chậm 5 phút</text>
    <text x="460" y="140" font-size="20" fill="#555555">→</text>
    <text x="570" y="70" text-anchor="middle" font-weight="bold">Sau buổi</text>
    <rect x="480" y="82" width="180" height="110" fill="#bcd8d2"/><text x="570" y="108" text-anchor="middle" font-size="12">Ghi lại cảm giác</text><text x="570" y="130" text-anchor="middle" font-size="12">Uống nước, ăn nhẹ</text><text x="570" y="152" text-anchor="middle" font-size="12">Ngủ đủ, nghỉ 1 ngày</text>
  </g>
  <text x="340" y="232" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1a3a4a">Buổi đầu tiên nhẹ nhàng: hoàn thành đủ 5 lần lặp lại là đạt.</text>
  <text x="340" y="300" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">Hình minh họa được vẽ riêng cho website.</text>
</svg>
