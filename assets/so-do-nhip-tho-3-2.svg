<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" role="img" aria-label="Nhịp thở khi chạy: chạy chậm thì nhịp 3:2, hít vào 3 bước, thở ra 2 bước, thở bằng bụng; chạy nhanh hơn thì nhịp 2:1, hít 2 bước, thở 1 bước; thở gấp giữa buổi thì chậm lại hoặc đi bộ, thở ra dài qua môi mím; đau ngực, khó thở bất thường hoặc chóng mặt thì dừng chạy ngay và gặp bác sĩ">
  <rect width="680" height="380" fill="#ffffff"/>
  <text x="340" y="28" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a3a4a">Nhịp thở khi chạy: hít vào 3 bước, thở ra 2 bước</text>
  <text x="340" y="48" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Theo Bài 15 (NHS tuần 4, Healthline, WebMD).</text>
  <g font-family="sans-serif" font-size="13" fill="#1a3a4a">
    <rect x="40" y="66" width="200" height="72" fill="#2e7d6b"/><text x="140" y="94" text-anchor="middle" font-weight="bold" fill="#ffffff">Chạy chậm,</text><text x="140" y="114" text-anchor="middle" font-weight="bold" fill="#ffffff">nói chuyện được</text>
    <rect x="250" y="66" width="390" height="72" fill="#bcd8d2"/><text x="270" y="94" font-size="12">Nhịp 3:2 — hít vào 3 bước, thở ra 2 bước</text><text x="270" y="114" font-size="12">Thở bằng bụng: bụng phồng lên khi hít vào</text>
    <rect x="40" y="148" width="200" height="72" fill="#2e7d6b"/><text x="140" y="176" text-anchor="middle" font-weight="bold" fill="#ffffff">Chạy nhanh hơn,</text><text x="140" y="196" text-anchor="middle" font-weight="bold" fill="#ffffff">thở gấp hơn</text>
    <rect x="250" y="148" width="390" height="72" fill="#bcd8d2"/><text x="270" y="176" font-size="12">Nhịp 2:1 — hít 2 bước, thở 1 bước</text><text x="270" y="196" font-size="12">Để miệng mở tự nhiên, thở sâu bằng bụng</text>
    <rect x="40" y="230" width="200" height="72" fill="#bcd8d2"/><text x="140" y="258" text-anchor="middle" font-weight="bold">Thở gấp giữa buổi</text>
    <rect x="250" y="230" width="390" height="72" fill="#bcd8d2"/><text x="270" y="258" font-size="12">Chậm lại hoặc đi bộ; thở ra dài qua môi mím</text><text x="270" y="278" font-size="12">Chậm lại trước, sửa nhịp thở sau</text>
  </g>
  <text x="340" y="330" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1a3a4a">Đau ngực, khó thở bất thường, chóng mặt: dừng chạy ngay và gặp bác sĩ.</text>
  <text x="340" y="350" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1a3a4a">Khởi động: đi bộ 5 phút. Ăn nhẹ 1–2 giờ trước khi chạy (NHS).</text>
  <text x="340" y="372" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">Hình minh họa tự vẽ.</text>
</svg>
