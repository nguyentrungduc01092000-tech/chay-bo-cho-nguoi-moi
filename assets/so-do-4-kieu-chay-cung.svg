<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-label="4 kiểu chạy cùng người khác: bạn thân hoặc đồng nghiệp thì dễ hẹn giờ và hiểu nhau; nhóm chạy ở công viên thì có nhiều tốc độ để chọn và có người dẫn dắt; gia đình thì cả nhà cùng ra khỏi nhà, dễ sắp xếp cuối tuần; sự kiện cộng đồng parkrun thì miễn phí và cho mọi người">
  <rect width="680" height="360" fill="#ffffff"/>
  <text x="340" y="28" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a3a4a">4 kiểu chạy cùng người khác</text>
  <text x="340" y="48" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Theo bài “Chạy bộ cùng bạn bè và gia đình” (NHS, parkrun, Mayo Clinic, WHO). Bảng so sánh là gợi ý sắp xếp.</text>
  <g font-family="sans-serif" font-size="13" fill="#1a3a4a">
    <rect x="40" y="66" width="290" height="100" fill="#bcd8d2"/><text x="185" y="94" text-anchor="middle" font-weight="bold">Bạn thân hoặc đồng nghiệp</text><text x="185" y="118" text-anchor="middle" font-size="12">Dễ hẹn giờ, hiểu nhau,</text><text x="185" y="138" text-anchor="middle" font-size="12">dễ nói thật khi mệt</text>
    <rect x="350" y="66" width="290" height="100" fill="#bcd8d2"/><text x="495" y="94" text-anchor="middle" font-weight="bold">Nhóm chạy ở công viên</text><text x="495" y="118" text-anchor="middle" font-size="12">Có nhiều tốc độ để chọn,</text><text x="495" y="138" text-anchor="middle" font-size="12">vui, có người dẫn dắt</text>
    <rect x="40" y="182" width="290" height="100" fill="#bcd8d2"/><text x="185" y="210" text-anchor="middle" font-weight="bold">Gia đình</text><text x="185" y="234" text-anchor="middle" font-size="12">Cả nhà cùng ra khỏi nhà,</text><text x="185" y="254" text-anchor="middle" font-size="12">dễ sắp xếp cuối tuần</text>
    <rect x="350" y="182" width="290" height="100" fill="#2e7d6b"/><text x="495" y="210" text-anchor="middle" font-weight="bold" fill="#ffffff">Sự kiện cộng đồng (parkrun)</text><text x="495" y="234" text-anchor="middle" font-size="12" fill="#ffffff">Miễn phí, cho mọi người,</text><text x="495" y="254" text-anchor="middle" font-size="12" fill="#ffffff">không ai quan tâm bạn chạy nhanh hay chậm</text>
  </g>
  <text x="340" y="318" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#1a3a4a">Chạy cùng người chậm hơn: chạy theo tốc độ của người chậm hơn, không bỏ ai lại giữa đường.</text>
  <text x="340" y="348" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555555">Hình minh họa được vẽ riêng cho website.</text>
</svg>
